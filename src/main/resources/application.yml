spring:
  application:
    name: api-gateway

  security:
    oauth2:
      resourceserver:
        jwt:
          # De donde saca el Gateway las claves publicas para validar firmas.
          # Apunta al JWKS de users-service:
          #   http://users-service:8082/.well-known/jwks.json   (asi lo setea el compose)
          #
          # SIN DEFAULT, a proposito. Si falta, el servicio no arranca y nombra
          # el placeholder que no pudo resolver. Un default seria peor: el
          # Gateway levantaria apuntando a un JWKS equivocado y contestaria 401
          # a TODO, que se reporta como "el login no anda" y se busca en el
          # lugar equivocado.
          #
          # Estaba solo en un @Value de SecurityConfig y no aca, asi que el
          # contenedor fallaba sin que nada dijera que variable exportar. Los
          # tests no lo notaban: la inyectan por @DynamicPropertySource.
          jwk-set-uri: ${JWKS_URI}

  cloud:
    gateway:
      server:
        webflux:
          # DEC-42 - son default filters, asi que los recibe TODA ruta que el
          # locator genere, incluidas las de los servicios que se sumen despues.
          #
          # El ORDEN de esta lista es el orden de la cadena: el primero
          # es el mas externo. Sale asi del manifiesto (§"patrones aplicados"):
          # rate limit -> bulkhead -> timeout -> retry -> circuit breaker -> fallback.
          # El rate limit y el bulkhead son GlobalFilter (@Order 80 y 90); el
          # timeout es el TimeLimiter de ResilienceConfig; los otros dos, esto.
          default-filters:
            # Solo GET: el unico verbo idempotente por definicion. Reintentar un
            # POST /registration duplica un alta, y reintentar un POST /2fa/verify
            # quema un intento del tope de 5. Con el breaker adentro, un reintento
            # con el circuito abierto falla rapido y cuesta solo el backoff.
            #
            # Sin jitter: el filtro de Spring Cloud Gateway no lo expone. Con
            # retries=1 el thundering herd es acotado, pero si algun dia esto sube
            # a 3 reintentos hay que reemplazarlo por un filtro propio.
            - name: Retry
              args:
                retries: 1
                methods: GET
                backoff:
                  firstBackoff: 50ms
                  maxBackoff: 500ms
                  factor: 2
                  basedOnPreviousValue: false
            # statusCodes NO es opcional: el filtro CircuitBreaker solo reacciona
            # a excepciones de la cadena reactiva, asi que sin esto un 500 del
            # backend pasa de largo y el breaker nunca abre.
            - name: CircuitBreaker
              args:
                name: porServicio
                fallbackUri: forward:/fallback/servicio
                statusCodes: 500,502,503,504

          # DEC-27 - the only static route besides the fallback. The locator only
          # generates Path=/api/{name}/**; without this the JWKS passes Security
          # guards and dies on a 404 from the gateway itself.
          routes:
            - id: jwks
              uri: lb://users-service
              predicates:
                - Path=/.well-known/jwks.json
              filters: []

  # In WebFlux a request hops between threads several times, so the traceId that
  # micrometer-tracing leaves in a ThreadLocal is gone by the time the logger
  # runs. With `auto`, Reactor carries it across operators and the pattern can
  # print it.
  reactor:
    context-propagation: auto

  # DEC-42 - el presupuesto de resiliencia asume que una lectura de sesion
  # tarda 500ms o falla. Sin este timeout, Lettuce usa su default de 60s: con
  # un Redis que NO rechaza la conexion sino que se queda mudo -- una particion,
  # una pausa de GC, un Redis bloqueado -- cada request autenticado cuelga un
  # minuto en vez de contestar 503 al medio segundo. El fail-closed de DEC-01
  # deja de existir, porque nunca llega a fallar.
  #
  # RedisConfig ya afirmaba en su javadoc que esto estaba aca. No estaba: se
  # perdio entre "el bloque lo manda L7" y "el bloque lo aplica Base", y el
  # unico lugar donde el timeout existia era un @DynamicPropertySource dentro
  # de SessionInvalidationIT -- o sea que la unica configuracion correcta vivia
  # en el test que la necesitaba.
  data:
    redis:
      host:    ${REDIS_HOST:localhost}
      port:    ${REDIS_PORT:6379}
      timeout: 500ms
      lettuce:
        pool:
          max-active: 16
          max-idle:   8
          min-idle:   2

gateway:
  jwt:
    expected-issuer: users-service      # DEC-07 - always validated (DEC-44)

  session-cache:                        # DEC-25
    ttl: 3s
    max-size: 10000

  routing:
    # DEC-06 - the ONE source of the allowlist. AllowlistRouteLocator reads it
    # to generate the routes, and the guards and ServiceAudienceFilter read it
    # to decide.
    #
    # Descubrimiento y exposicion son cosas distintas (manifiesto del Gateway
    # §04). Que un servicio se registre en Eureka NO lo expone: el gateway lo
    # rutea recien cuando su serviceId esta en esta lista. Fuera de ella, 404.
    # Es friccion a proposito, con doce equipos sumando servicios.
    #
    # La lista se sobreescribe entera con GATEWAY_ALLOWLIST (separada por comas)
    # para que dar de alta un equipo sea una linea del compose y no un PR a este
    # repo. Sigue necesitando reiniciar el gateway; nunca es en caliente.
    allowlist: ${GATEWAY_ALLOWLIST:users-service,echo-service}
    service-id-suffix: "-service"
    path-prefix: "/api"

  identity:
    reserved-headers:
      - X-Principal-Type
      - X-User-Id
      - X-Service-Id
      - X-User-Roles
      - X-Service-Scopes

  # DEC-42 - concurrencia maxima por destino. Ver BulkheadFilter: el breaker
  # mide fallas y el bulkhead mide ocupacion, y un destino lento que todavia no
  # falla se come el pool del Gateway sin que el breaker se entere.
  # Orden de magnitud para los 120 concurrentes de RF-NFR-03, sin calibrar.
  bulkhead:
    enabled: ${BULKHEAD_ENABLED:true}
    max-concurrent-calls: ${BULKHEAD_MAX_CONCURRENT:64}
    # 0 = rechaza en el acto. Encolar esperando un permiso es lo que el bulkhead
    # viene a evitar: la request que espera igual ocupa memoria y conexion.
    max-wait: 0ms

  rate-limit:
    enabled: true
    # DEC-24 - the auth route IS expensive and its bucket is keyed by IP.
    expensive-routes:
      - path: /api/users/public/auth/**
        key: IP
        capacity: ${RATE_LIMIT_AUTH_CAPACITY:600}
        refill-per-minute: ${RATE_LIMIT_AUTH_REFILL:600}
      # El registro manda mails, y /resend-activation los manda sin autenticar
      # contra cualquier direccion que le pasen. Sin esta entrada el unico tope
      # es el TTL del enlace, que no es un tope. Mucho mas ajustado que auth:
      # una persona reintenta tres o cuatro veces, un script no.
      # Orden de magnitud, sin calibrar.
      - path: /api/users/public/registration/**
        key: IP
        capacity: ${RATE_LIMIT_REGISTRATION_CAPACITY:10}
        refill-per-minute: ${RATE_LIMIT_REGISTRATION_REFILL:10}
    # DEC-24 - de donde sale la IP real para el bucket por IP.
    #
    # Con el proxy reverso adelante esto YA NO PUEDE quedar vacio: si el gateway
    # no confia en el hop anterior, ignora X-Forwarded-For y toma la IP de nginx,
    # que es la misma para todo el mundo. El bucket por IP pasaria a ser un
    # bucket global y el primer script que martille /auth deja sin login a todos.
    #
    # El default cubre el rango de redes bridge de Docker. Es amplio a proposito
    # y es seguro porque el gateway no publica puerto: el unico que puede
    # mandarle un request es nginx, que vive con el en la red tpi-edge.
    trusted-proxies: ${GATEWAY_TRUSTED_PROXIES:172.16.0.0/12,127.0.0.1/32}

# ---------------------------------------------------------------------------
# Every lot adds its own block here. This file has ONE owner (see
# TASK-ASSIGNMENT.md): send the block instead of committing it, or ten branches
# collide in the same place.
#
#   spring.cloud.gateway  -> L7  (routing, the static JWKS route, fallback)
#   spring.data.redis     -> L7  (session repository)
#   resilience4j          -> L10 (breaker, bulkhead, fallback)
# ---------------------------------------------------------------------------

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true          # the gateway is the ONLY one that needs the registry
    # Manifiesto del Gateway §10. Sin esto Eureka marca UP con el solo heartbeat,
    # que dice "el proceso vive", no "puede atender". Una instancia con readiness
    # DOWN -sin base, sin Redis, todavia arrancando- seguiria recibiendo trafico
    # del balanceador. Con esto, el estado que Eureka publica es el de Actuator.
    healthcheck:
      enabled: true
  instance:
    prefer-ip-address: true

server:
  port: ${SERVER_PORT:8080}

management:
  # Without this the default sampling is 10%: nine out of ten requests have no
  # active span and come out with no traceId. To be able to follow ANY request
  # through the logs, everything is sampled.
  tracing:
    sampling:
      probability: 1.0
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      # `gateway` estaba en esta lista y NO hacia nada: con Boot 4.1 /
      # Spring Cloud 2025.1.3 el endpoint no se registra (el actuator expone
      # cuatro endpoints y /actuator/gateway/routes da 404). Config muerta que
      # hace creer que hay una forma de ver la tabla de rutas, y no la hay.
      #
      # Para saber si un servicio esta ruteado, se pregunta por la puerta:
      #   404 route-not-found  -> no esta en la allowlist
      #   503 service-unavailable -> esta en la allowlist, sin instancias UP
      #   cualquier otra cosa  -> esta ruteado y contesto el destino
      # Y para ver quien esta registrado: http://localhost:8761/eureka/apps
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
